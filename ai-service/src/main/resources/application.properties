spring.application.name=ai-service

server.port=8088

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8380/realms/agroflowers-realm

sales-service.base-url=http://localhost:8086
gemini.base-url=https://generativelanguage.googleapis.com
gemini.api-key=
gemini.model=gemini-2.0-flash

resilience4j.circuitbreaker.instances.salesService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.salesService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.salesService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.salesService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.salesService.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.salesService.permittedNumberOfCallsInHalfOpenState=3

resilience4j.retry.instances.salesService.maxAttempts=3
resilience4j.retry.instances.salesService.waitDuration=500ms
resilience4j.retry.instances.salesService.retryExceptions=java.io.IOException,org.springframework.web.reactive.function.client.WebClientRequestException

resilience4j.circuitbreaker.instances.gemini.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.gemini.slidingWindowSize=5
resilience4j.circuitbreaker.instances.gemini.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.gemini.failureRateThreshold=50
resilience4j.circuitbreaker.instances.gemini.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.gemini.permittedNumberOfCallsInHalfOpenState=2

resilience4j.retry.instances.gemini.maxAttempts=2
resilience4j.retry.instances.gemini.waitDuration=1s
resilience4j.retry.instances.gemini.retryExceptions=org.springframework.web.reactive.function.client.WebClientResponseException.InternalServerError,org.springframework.web.reactive.function.client.WebClientResponseException.TooManyRequests,java.io.IOException

management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always
