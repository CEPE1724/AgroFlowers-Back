spring.application.name=logistics-service

server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5437/logistics_db
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8380/realms/agroflowers-realm

catalog-service.base-url=http://localhost:8083
